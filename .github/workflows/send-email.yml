name: SAS Send Advertisement Email

on:
  push:
    paths:
      - "requests/**"

permissions:
  contents: write

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install nodemailer

      - name: Send advertisement request email
        env:
          SAS_EMAIL: ${{ secrets.SAS_EMAIL }}
          SAS_PASS: ${{ secrets.SAS_PASS }}
        run: node send-email.js

      - name: Commit processed request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests archive failed
          git diff --cached --quiet || git commit -m "Process SAS advertisement request"
          git push
          
